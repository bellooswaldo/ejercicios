<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Visor de texto</title>
  <style>
    body {
      font-family: monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    body.theme-light {
      background: #f4f4f4;
      color: #333333;
    }
    body.theme-light textarea {
      background: #ffffff;
      color: #333333;
      border: 1px solid #cccccc;
    }
    body.theme-light button {
      background: #007bff;
      color: #ffffff;
    }
    body.theme-light button:hover {
      background: #0056b3;
    }
    body.theme-dark {
      background: #1e1e1e;
      color: #e0e0e0;
    }
    body.theme-dark textarea {
      background: #2d2d2d;
      color: #e0e0e0;
      border: 1px solid #4a4a4a;
    }
    body.theme-dark button {
      background: #4da6ff;
      color: #1a1a1a;
    }
    body.theme-dark button:hover {
      background: #3399ff;
    }
    h3 {
      margin: 0 0 10px 0;
      word-break: break-all;
    }
    textarea {
      flex: 1;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 4px;
      resize: none;
      margin-bottom: 10px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h3 id="file-name"></h3>
  <textarea readonly id="content"></textarea>
  <button onclick="window.close()">Cerrar</button>
  <script src="./renderer.js"></script>
</body>
</html>
