<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Visor de imágenes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    body.theme-light {
      background: #1a1a1a;
    }

    body.theme-dark {
      background: #0a0a0a;
    }

    .media-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      padding: 20px;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    button {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      z-index: 10;
      transition: all 0.2s ease;
    }

    button:hover {
      background: rgba(0, 0, 0, 0.9);
      transform: scale(1.02);
    }

    .image-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 10;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <button onclick="window.close()">Cerrar</button>
  <div class="media-container">
    <img id="image" alt="Imagen" style="display: none;" />
  </div>
  <div class="image-info" id="image-info"></div>
  <div class="loading" id="loading">Cargando imagen...</div>
  <script src="./renderer.js"></script>
</body>
</html>
